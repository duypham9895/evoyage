name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual replay (e.g. after a transient infra failure)

permissions:
  contents: read
  deployments: write

# Serialize prod deploys, but keep PR checks isolated per ref so Dependabot
# bursts do not block or cancel unrelated validation runs.
concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Prisma schema vs production DB
        if: github.actor != 'dependabot[bot]'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "${DIRECT_URL:-}" ]; then
            echo "::error::DIRECT_URL secret is not set on the repo. Add it (Supabase direct-connection URL, port 5432) under Settings → Secrets → Actions."
            exit 1
          fi
          if ! npx prisma migrate diff \
            --from-url "$DIRECT_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code; then
            echo ""
            echo "::error::Schema drift detected — prisma/schema.prisma does not match the production DB."
            echo "::error::Run 'npx prisma db push' against Supabase before pushing schema changes."
            exit 1
          fi

      - name: Skip Prisma drift check for Dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Skipping production DB drift check because Dependabot pull_request runs cannot access Actions secrets."

      # Report-only on purpose — these must NOT gate merges yet. There is a
      # pre-existing backlog of eslint and tsc findings, so making these
      # blocking today would fail every open PR instead of catching anything
      # new. No count is recorded here on purpose: the numbers move with every
      # cleanup commit, and a stale number in a comment is how the rest of this
      # repo's documentation drifted. Measure the current state with:
      #   npx eslint src scripts ; npx tsc --noEmit
      # Ratchet: once both are clean, delete the two `continue-on-error` lines
      # below so these become real gates.
      #
      # Caveat: with continue-on-error the check stays green on the PR list, so
      # output is only visible to someone who opens the run. Promote to blocking
      # as soon as the backlog allows.
      - name: Lint (report only)
        continue-on-error: true
        run: npx eslint src scripts

      - name: Type check (report only)
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Install Playwright system deps (cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit firefox

      - name: Run E2E tests
        timeout-minutes: 15
        run: npx playwright test --workers=2
        env:
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN || 'pk.dummy_token_for_ci_build' }}

      - name: Upload E2E test artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # PREVIEW DEPLOY ON PRs.
      #
      # Until 2026-09-30 every deploy step was gated on `push` to main, so a
      # pull_request run never invoked Vercel at all — it only ran tests. The
      # required status check is named "Deploy to Vercel", so a PR could be
      # fully green and still fail to deploy the moment it merged. #78 and #79
      # both did exactly that, failing on an ENOENT that no PR check could see.
      #
      # A preview deploy exercises the same pull/build/deploy path against the
      # same `.vercelignore` and the same output file tracing, so that class of
      # failure is caught before merge instead of after.
      #
      # Skipped for Dependabot: its pull_request runs cannot read Actions
      # secrets, so VERCEL_TOKEN would be empty. Same rationale as the
      # production DB drift check above.
      - name: Install Vercel CLI (preview)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: npm i -g vercel

      - name: Pull Vercel environment (preview)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build (preview)
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy preview
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        run: |
          # Same pipefail reasoning as the production deploy below: `bash -e`
          # does not imply pipefail, so piping into `tail` would mask a failure.
          set -eo pipefail
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -n1)
          case "$url" in
            https://*) echo "Preview: $url" ;;
            *)
              echo "::error::vercel preview deploy returned no URL (got: '$url')"
              exit 1
              ;;
          esac

      - name: Note skipped preview deploy
        if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
        run: |
          echo "Skipping preview deploy - Dependabot pull_request runs cannot access Actions secrets."

      - name: Install Vercel CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm i -g vercel

      - name: Pull Vercel environment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Create GitHub deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: gh-deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deployment_id=$(jq -n --arg sha "${{ github.sha }}" '{
            ref: $sha,
            environment: "production",
            description: "Vercel production deploy",
            auto_merge: false,
            required_contexts: []
          }' | gh api "repos/${{ github.repository }}/deployments" --method POST --input - --jq '.id')
          echo "id=$deployment_id" >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: vercel-deploy
        run: |
          # GitHub runs `run:` as `bash -e`, which is errexit WITHOUT pipefail.
          # `url=$(vercel deploy ... | tail -n1)` therefore returned tail's exit
          # status, so a failed deploy exited 0, this step passed, and the next
          # step recorded a GitHub deployment as successful. Deployments errored
          # from 2026-06-06 to 2026-09-30 while every run stayed green and the
          # production domain silently kept serving the June build.
          set -eo pipefail

          url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tail -n1)

          # `vercel deploy` exiting 0 is necessary but not sufficient: assert we
          # actually got a deployment URL back before calling this a success.
          case "$url" in
            https://*) ;;
            *)
              echo "::error::vercel deploy returned no deployment URL (got: '$url')"
              exit 1
              ;;
          esac

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Mark deployment success
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.gh-deployment.outputs.id }}/statuses" \
            --method POST \
            -f state="success" \
            -f environment_url="${{ steps.vercel-deploy.outputs.url }}" \
            -f description="Deployed to Vercel"

      - name: Mark deployment failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gh-deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/deployments/${{ steps.gh-deployment.outputs.id }}/statuses" \
            --method POST \
            -f state="failure" \
            -f description="Vercel deploy failed"
