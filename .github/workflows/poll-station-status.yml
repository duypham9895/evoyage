name: Poll Station Status

# Runs the VinFast polling job every 2 hours to dedup-on-change insert fresh
# chargingStatus observations into Postgres.
#
# Cadence rationale: every 2 hours gives 12 samples/day per cell, which is
# usable for the 168-cell popularity heatmap. Hourly would be better.
#
# Nothing technical caps this at 2h. The repo is public, so Actions minutes are
# unmetered, and this job is self-contained: main() in
# scripts/poll-vinfast-station-status.ts opens its own Chromium context, mints
# its own cookies, calls persistCookies() and only then polls — pollStationStatus
# reads back the row it just wrote, and its fetchLocators is stubbed to the
# payload already in memory. It does NOT depend on any other workflow at
# runtime. Raising the cadence is a sampling decision, not a cost or a
# cookie-lifetime constraint.
#
# Production finding 2026-05-25: VinFast/Cloudflare accepts the browser
# verification request during cookie refresh, but can still reject Vercel's
# server-side replay of those cookies with 403. Poll from a Chromium context on
# the GitHub runner instead of POSTing the Vercel endpoint.

on:
  schedule:
    # Every 2 hours, 5 minutes past the hour.
    - cron: '5 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Poll station status
        run: npx tsx scripts/poll-vinfast-station-status.ts

      # Finding C of docs/bugs/2026-11-01-p2-cron-silent-noops-and-observability.md:
      # nobody heard about a month of failed runs. Open one issue per workflow
      # and comment on it for each further scheduled failure (manual runs are
      # watched by whoever started them).
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled workflow failing: ${WORKFLOW_NAME}"
          issue=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // \"\"")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: ${RUN_URL}"
          else
            body="The scheduled run failed: ${RUN_URL}"
            gh issue create --title "$title" --body "$body" --label needs-triage \
              || gh issue create --title "$title" --body "$body"
          fi
