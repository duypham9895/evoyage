name: Poll Station Status

# Runs the VinFast polling job every 2 hours to dedup-on-change insert fresh
# chargingStatus observations into Postgres.
#
# Cadence rationale: every 2 hours gives 12 samples/day per cell, which is
# usable for the 168-cell popularity heatmap. Hourly would be better.
#
# Nothing technical caps this at 2h. The repo is public, so Actions minutes are
# unmetered, and this job is self-contained: main() in
# scripts/poll-vinfast-station-status.ts opens its own Chromium context, mints
# its own cookies, calls persistCookies() and only then polls — pollStationStatus
# reads back the row it just wrote, and its fetchLocators is stubbed to the
# payload already in memory. It does NOT depend on refresh-vinfast-cookies.yml
# at runtime. Raising the cadence is a sampling decision, not a cost or a
# cookie-lifetime constraint.
#
# Production finding 2026-05-25: VinFast/Cloudflare accepts the browser
# verification request during cookie refresh, but can still reject Vercel's
# server-side replay of those cookies with 403. Poll from a Chromium context on
# the GitHub runner instead of POSTing the Vercel endpoint.

on:
  schedule:
    # Every 2 hours, 5 minutes past the hour (gives the cookie-refresh
    # workflow time to finish its top-of-hour run before we poll).
    - cron: '5 */2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(node -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Poll station status
        run: npx tsx scripts/poll-vinfast-station-status.ts
