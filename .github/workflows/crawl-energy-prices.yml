name: Crawl Energy Prices

on:
  schedule:
    # Run daily at 03:00 UTC (10:00 AM Vietnam) — Petrolimex usually adjusts
    # at 15:00 ICT (08:00 UTC) on Thursdays, so 10:00 AM next-day reliably
    # captures the previous day's adjustment.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Crawl and sync the README on the runner, print the diff, and open no PR'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialize so a manual dispatch can't race the automation PR update.
concurrency:
  group: crawl-energy-prices
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout v6+ stores GITHUB_TOKEN as an auth header in a separate
          # includeIf'd config file; if persisted, it wins over the PAT on push
          # and GitHub runs no CI for the sync PR. The PR step authenticates
          # with AUTOMATION_PAT via the remote URL instead.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tee'd so the failure-issue step can quote the actual error instead of
      # only the run URL — nine "Failed again: <url>" comments on #176 never
      # said the parser had found 0 tiers.
      - name: Crawl energy prices (Petrolimex + V-GREEN + EVN)
        run: |
          set -o pipefail
          npx tsx scripts/crawl-energy-prices.ts 2>&1 | tee "${RUNNER_TEMP}/crawl.log"

      - name: Sync README energy-prices block
        run: npx tsx scripts/update-readme-stats.ts --only=energy

      # A dry run exercises the real crawl against live EVN and Petrolimex on a
      # real runner — the one thing no offline test can cover — and stops before
      # anything is published. Scheduled runs never take this path.
      - name: Report dry-run result
        if: inputs.dry_run
        run: |
          echo "### Dry run: no PR will be opened" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            git diff --stat
            echo '```'
            echo '```json'
            node -e "console.log(JSON.stringify(require('./src/data/energy-prices.json').evnResidential, null, 2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git diff --stat
          node -e "console.log(JSON.stringify(require('./src/data/energy-prices.json').evnResidential, null, 2))"

      # Same token rationale as crawl-stations.yml: PRs made with GITHUB_TOKEN
      # never get the required check. The crawl step now exits non-zero when any
      # source fell back to a previous value, so this step only runs on fresh data.
      - name: Open energy-prices sync PR
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          # Actions' default shell is `bash -e {0}` — errexit on, pipefail OFF.
          # Without this, `pr=$(gh pr create ... | tail -1)` takes tail's exit
          # status (always 0) and a failed create silently yields an empty PR.
          set -o pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTOMATION_PAT secret is not set. See docs/agents/automation-pat.md."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add src/data/energy-prices.json README.md
          if git diff --cached --quiet; then
            echo "No energy-price changes to commit."
            exit 0
          fi

          branch="automation/energy-prices"
          git checkout -b "$branch"
          git commit -m "chore(energy-prices): daily sync"

          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // ""')
          if [ -n "$pr" ]; then
            echo "Updated existing energy-prices sync PR #$pr."
          else
            # Use the URL `gh pr create` prints. The second `gh pr list` this
            # replaces was a second GraphQL call that could fail after the PR
            # already existed (2026-11-04: PR #175 left without auto-merge), and
            # it had no `// ""` default, so an empty list produced `gh pr merge null`.
            pr=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(energy-prices): daily sync" \
              --body "Automated energy price data sync from the scheduled GitHub Actions workflow. Auto-merges once the required check passes." | tail -1) || {
              echo "::error::gh pr create failed for ${branch}; see this step's log for its stderr."
              exit 1
            }
          fi

          if [ -z "$pr" ]; then
            # Never run `gh pr merge ""` — it would resolve the current branch
            # or fail three times blaming the wrong command.
            echo "::error::No PR to merge for ${branch}: gh pr create printed no URL."
            exit 1
          fi

          # Retry: one transient GraphQL error here leaves the PR open with
          # auto-merge off, and nothing re-arms it until the next green run.
          for attempt in 1 2 3; do
            if gh pr merge "$pr" --auto --merge; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "gh pr merge attempt ${attempt} failed; retrying in $((attempt * 10))s."
              sleep $((attempt * 10))
            fi
          done
          echo "::error::gh pr merge --auto failed 3 times for ${pr}."
          exit 1

      # Finding C of docs/bugs/2026-11-01-p2-cron-silent-noops-and-observability.md:
      # nobody heard about a month of failed runs. Open one issue per workflow
      # and comment on it for each further scheduled failure (manual runs are
      # watched by whoever started them).
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled workflow failing: ${WORKFLOW_NAME}"
          log="${RUNNER_TEMP}/crawl.log"
          captured=""
          if [ -s "$log" ]; then
            # The narrow grep pattern is a SECURITY CONTROL, not just a filter.
            # This repo is public and the quoted text is upstream-controlled
            # (URLs and HTML from EVN reach the log through error messages).
            # Line-based matching on these four words is what stops a line that
            # is only ``` from closing the code fence below, and what keeps
            # @mentions out of the issue body. Do not widen it, and do not add
            # -A/-B context lines, without replacing it with real escaping.
            # tee writes raw bytes, so the runner's secret masking does not
            # apply here: redact what can carry a credential and cap line length
            # before posting. Only database URLs and URLs with an embedded
            # user:password are redacted — a plain https:// EVN article URL is
            # the diagnostic the alert exists to carry (Step 3 rule 5 puts one
            # per rejected candidate in the message), so redacting those would
            # leave the operator unable to tell which article failed.
            # The sed runs ONLY on log lines — never on RUN_URL.
            captured=$(grep -aE 'Error|FAILED|FATAL|error:' "$log" \
              | tail -3 \
              | sed -E -e 's#postgres(ql)?://[^[:space:]]*#<redacted-db-url>#g' \
                       -e 's#(https?)://[^/@[:space:]]*:[^@[:space:]]*@[^[:space:]]*#\1://<redacted-credentials>#g' \
              | cut -c1-400 || true)
          fi
          if [ -z "$captured" ]; then
            captured="(no error line captured — open the run log)"
          fi
          body=$(printf 'The scheduled run failed: %s\n\nLast error lines from the crawl step (may predate the failure):\n\n```\n%s\n```' "${RUN_URL}" "$captured")

          issue=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // \"\"")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label needs-triage \
              || gh issue create --title "$title" --body "$body"
          fi
