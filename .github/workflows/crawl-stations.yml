name: Crawl Charging Stations

on:
  schedule:
    # Run daily at 01:00 UTC (08:00 AM Vietnam)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

# Serialize so a manual dispatch during the daily run can't race the automation
# PR update at the end of the job.
concurrency:
  group: crawl-stations
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # checkout v6+ stores GITHUB_TOKEN as an auth header in a separate
          # includeIf'd config file; if persisted, it wins over the PAT on push
          # and GitHub runs no CI for the sync PR. The PR step authenticates
          # with AUTOMATION_PAT via the remote URL instead.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Primary source — VinFast / V-Green (~16k stations). Failure here fails the job.
      # Tee'd so the failure-issue step can quote the actual error, not just the run URL.
      - name: Crawl VinFast stations
        run: |
          set -o pipefail
          npx tsx scripts/crawl-vinfast-stations.ts 2>&1 | tee "${RUNNER_TEMP}/crawl.log"

      # Secondary sources — non-VinFast diversity (Tier A). Each step is wrapped in
      # `continue-on-error: true` so a flaky upstream doesn't block the others.
      - name: Crawl EVPower stations
        continue-on-error: true
        run: npx tsx scripts/crawl-evpower-stations.ts

      - name: Seed OpenStreetMap stations
        continue-on-error: true
        run: npx tsx scripts/seed-osm-stations.ts

      - name: Seed Open Charge Map stations
        continue-on-error: true
        env:
          OPEN_CHARGE_MAP_API_KEY: ${{ secrets.OPEN_CHARGE_MAP_API_KEY }}
        run: npx tsx scripts/fetch-universal-stations.ts

      - name: Seed manual-curation CSV
        continue-on-error: true
        run: npx tsx scripts/seed-manual-stations.ts

      - name: Promote crowdsourced reports
        continue-on-error: true
        run: npx tsx scripts/promote-crowdsourced-stations.ts

      - name: Sync README station count
        run: npx tsx scripts/update-readme-stats.ts --only=stations

      # Pushes and opens the PR with AUTOMATION_PAT, not GITHUB_TOKEN. GitHub runs
      # no workflows for pushes/PRs made with GITHUB_TOKEN, so the required
      # "Deploy to Vercel" check never appeared and every sync PR stayed BLOCKED
      # (PR #48 sat open from 2026-06-02). With the PAT, CI runs, auto-merge
      # lands the PR once green, and the merge push triggers the prod deploy.
      - name: Open station-stats sync PR
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_PAT }}
        run: |
          # Actions' default shell is `bash -e {0}` — errexit on, pipefail OFF.
          # Without this, `pr=$(gh pr create ... | tail -1)` takes tail's exit
          # status (always 0) and a failed create silently yields an empty PR.
          set -o pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTOMATION_PAT secret is not set. See docs/agents/automation-pat.md."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git add src/data/station-stats.json README.md
          if git diff --cached --quiet; then
            echo "No station-count changes to commit."
            exit 0
          fi
          COUNT=$(node -e "console.log(require('./src/data/station-stats.json').count)")

          branch="automation/stations"
          git checkout -b "$branch"
          git commit -m "chore(stations): sync VinFast count to ${COUNT}"

          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "$branch"

          pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // ""')
          if [ -n "$pr" ]; then
            echo "Updated existing station sync PR #$pr."
          else
            # Use the URL `gh pr create` prints. The second `gh pr list` this
            # replaces was a second GraphQL call that could fail after the PR
            # already existed, and it had no `// ""` default, so an empty list
            # produced `gh pr merge null`.
            pr=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "chore(stations): sync VinFast count to ${COUNT}" \
              --body "Automated station count sync from the scheduled GitHub Actions workflow. Auto-merges once the required check passes." | tail -1) || {
              echo "::error::gh pr create failed for ${branch}; see this step's log for its stderr."
              exit 1
            }
          fi

          if [ -z "$pr" ]; then
            # Never run `gh pr merge ""` — it would resolve the current branch
            # or fail three times blaming the wrong command.
            echo "::error::No PR to merge for ${branch}: gh pr create printed no URL."
            exit 1
          fi

          # Retry: one transient GraphQL error here leaves the PR open with
          # auto-merge off, and nothing re-arms it until the next green run.
          for attempt in 1 2 3; do
            if gh pr merge "$pr" --auto --merge; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "gh pr merge attempt ${attempt} failed; retrying in $((attempt * 10))s."
              sleep $((attempt * 10))
            fi
          done
          echo "::error::gh pr merge --auto failed 3 times for ${pr}."
          exit 1

      # Finding C of docs/bugs/2026-11-01-p2-cron-silent-noops-and-observability.md:
      # nobody heard about a month of failed runs. Open one issue per workflow
      # and comment on it for each further scheduled failure (manual runs are
      # watched by whoever started them).
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled workflow failing: ${WORKFLOW_NAME}"
          log="${RUNNER_TEMP}/crawl.log"
          captured=""
          if [ -s "$log" ]; then
            # The narrow grep pattern is a SECURITY CONTROL, not just a filter.
            # This repo is public and the quoted text is upstream-controlled
            # (URLs and HTML from the crawled sites reach the log through error
            # messages). Line-based matching on these four words is what stops a
            # line that is only ``` from closing the code fence below, and what
            # keeps @mentions out of the issue body. Do not widen it, and do not
            # add -A/-B context lines, without replacing it with real escaping.
            # tee writes raw bytes, so the runner's secret masking does not apply
            # here — and this job holds DATABASE_URL/DIRECT_URL. Redact what can
            # carry a credential and cap line length before posting: database
            # URLs and URLs with an embedded user:password. Plain https:// URLs
            # are left alone because they are the diagnostic the alert carries.
            # The sed runs ONLY on log lines — never on RUN_URL.
            captured=$(grep -aE 'Error|FAILED|FATAL|error:' "$log" \
              | tail -3 \
              | sed -E -e 's#postgres(ql)?://[^[:space:]]*#<redacted-db-url>#g' \
                       -e 's#(https?)://[^/@[:space:]]*:[^@[:space:]]*@[^[:space:]]*#\1://<redacted-credentials>#g' \
              | cut -c1-400 || true)
          fi
          if [ -z "$captured" ]; then
            captured="(no error line captured — open the run log)"
          fi
          body=$(printf 'The scheduled run failed: %s\n\nLast error lines from the crawl step (may predate the failure):\n\n```\n%s\n```' "${RUN_URL}" "$captured")

          issue=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // \"\"")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label needs-triage \
              || gh issue create --title "$title" --body "$body"
          fi
