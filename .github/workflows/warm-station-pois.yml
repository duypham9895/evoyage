name: Warm Station POIs

# Pre-populates the StationPois cache for top 50 VinFast stations so
# first-time visitors hit a warm cache (<50ms) instead of waiting for
# Overpass round-trip (~1.5s). Daily cadence is plenty — POIs don't
# change weekly.

on:
  schedule:
    # Daily at 04:00 UTC (11:00 AM Vietnam, after the morning rush)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Warm POI cache for top 50 stations
        run: npx tsx scripts/warm-station-pois.ts

      # Finding C of docs/bugs/2026-11-01-p2-cron-silent-noops-and-observability.md:
      # nobody heard about a month of failed runs. Open one issue per workflow
      # and comment on it for each further scheduled failure (manual runs are
      # watched by whoever started them).
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled workflow failing: ${WORKFLOW_NAME}"
          issue=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // \"\"")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: ${RUN_URL}"
          else
            body="The scheduled run failed: ${RUN_URL}"
            gh issue create --title "$title" --body "$body" --label needs-triage \
              || gh issue create --title "$title" --body "$body"
          fi
