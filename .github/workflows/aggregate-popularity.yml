name: Aggregate Station Popularity

# Daily aggregation that rebuilds the StationPopularity 168-cell heatmap from
# the rolling 60-day window of StationStatusObservation rows, and prunes raw
# observations older than 90 days.
#
# Idempotent — re-running on the same day overwrites with identical numbers.

on:
  schedule:
    # Daily at 19:00 UTC = 02:00 AM Vietnam (off-peak)
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST aggregate-popularity
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl -s -X POST https://evoyage.duypham.me/api/cron/aggregate-popularity \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 \
            --fail-with-body)
          echo "Response: $response"
          # jq -e also fails on a non-JSON body or a missing field, which the old
          # grep for '"ok":false' let through. 0 rows upserted means the
          # observation window is empty: the poller is dead, so fail loudly.
          if ! echo "$response" | jq -e '.ok == true and .popularityRowsUpserted > 0' >/dev/null; then
            echo "::error::Aggregation endpoint reported an unhealthy run (ok is not true, or 0 rows upserted)"
            exit 1
          fi

      # Finding C of docs/bugs/2026-11-01-p2-cron-silent-noops-and-observability.md:
      # nobody heard about a month of failed runs. Open one issue per workflow
      # and comment on it for each further scheduled failure (manual runs are
      # watched by whoever started them).
      - name: Open or update failure issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled workflow failing: ${WORKFLOW_NAME}"
          issue=$(gh issue list --state open --search "\"${title}\" in:title" --json number,title \
            --jq "map(select(.title == \"${title}\")) | .[0].number // \"\"")
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Failed again: ${RUN_URL}"
          else
            body="The scheduled run failed: ${RUN_URL}"
            gh issue create --title "$title" --body "$body" --label needs-triage \
              || gh issue create --title "$title" --body "$body"
          fi
